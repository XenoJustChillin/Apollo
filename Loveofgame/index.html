<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://cdn.jsdelivr.net/npm/@tailwindcss/browser@4"></script>
    <title>Apollo</title>
</head>
<body>
    <div class="mainCont w-[100vw]">



        <!--BEGINNING OF HEADER-->
        <div class="header w-[100vw] flex justify-between p-5 bg-red-200">
            <div class="logo">placeholder</div>
            <div class="nav">
                HamMenu
            </div>
        </div>
        <!--END OF HEADER-->



        <!--BEGINNING OF HERO-->
        <div class="hero bg-[url('./assets/mainHeroImg.jpg')] bg-cover bg-center bg-no-repeat m-4 p-4 h-[60vh] rounded-[8px] flex justify-center items-center">
            <div class="heroContent bg-blue-300 py-8 px-8 rounded-[4px] shadow-md">
                <h1 class="text-[2rem] font-bold">Main Heading</h1>
                <p class="text-[0.75rem] py-2">Lorem ipsum dolor sit amet consectetur adipisicing elit. Ea, repellendus!</p>
                <button class="bg-yellow-300 px-3 py-1 rounded-[4px] shadow-sm mt-2 text-[0.75rem]">Contact Us</button>
            </div>
        </div>
        <!--END OF HEADER-->


        <div class="w-[90vw] ml-[5vw] pb-3 pt-2 opacity-15">
            <hr>
        </div>


        <!--BEGINNING OF HOW IT WORKS-->
        <div class="howItWorks">
            <h1 class="text-[1.5rem] font-bold m-4 pb-4 underline">How It Works:</h1>
            <div class="cardBox">
                <div class="card bg-green-200 m-4 p-6 flex flex-row items-end rounded-[4px] shadow-sm">
                    <h2 class="text-[1.25rem] font-bold">1.</h2>
                    <p class="text-[0.75rem] pb-1 pl-3">The customer texts or calls your business.</p>
                </div>

                <div class="flex justify-center align-center">
                    <div class="max-w-[30px]">
                        <img src="./assets/arrowDown.png" class=" w-[100%]"/>
                    </div>
                </div>

                <div class="card bg-green-200 m-4 p-6 flex flex-row items-end rounded-[4px] shadow-sm">
                    <h2 class="text-[1.25rem] font-bold">2.</h2>
                    <p class="text-[0.75rem] pb-1 pl-3">Your assistant answers and collects booking details.</p>
                </div>

                <div class="flex justify-center align-center">
                    <div class="max-w-[30px]">
                        <img src="./assets/arrowDown.png" class=" w-[100%]"/>
                    </div>
                </div>

                <div class="card bg-green-200 m-4 p-6 flex flex-row items-end rounded-[4px] shadow-sm">
                    <h2 class="text-[1.25rem] font-bold">3.</h2>
                    <p class="text-[0.75rem] pb-1 pl-3">Your business gets a text summary and confirms.</p>
                </div>
            </div>
        </div>
        <!--END OF HOW IT WORKS-->


        <div class="w-[90vw] ml-[5vw] pb-3 pt-2 opacity-15">
            <hr>
        </div>


        <!--BEGINNING OF ABOUT MESSAGES-->
        <div class="aboutMessages">

        </div>
        <!--END OF ABOUT MESSAGES-->



        <!--BEGINNING OF CONTACT US-->
        <div class="contactUs"></div>
        <!--END OF CONTACT US-->



        <!--BEGINNING OF FOOTER-->
        <div class="footer"></div>
        <!--END OF FOOTER-->



    </div>
</body>
</html>
